
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şarkılarım</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

.song {
    background: #222;
    padding: 15px;
    margin: 15px auto;
    max-width: 400px;
    border-radius: 10px;
}

audio {
    width: 100%;
    margin: 10px 0;
}

a {
    display: inline-block;
    background: white;
    color: black;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Şarkılarım</h1>

<div id="songs"></div>

<script>
const songs = [
    ["Felek", "Felek.mp3"],
    ["Yanımda sen olmayınca", "Yanimda-Sen-Olmayinca.mp3"],
    ["Ah gardaş", "Ah-Gardas.mp3"],
    ["Diyardan Diyara", "Diyardan-Diyara.mp3"],
    ["Isırgan otu", "Isirgan-Otu.mp3"]
];

const container = document.getElementById("songs");

songs.forEach(song => {
    const div = document.createElement("div");
    div.className = "song";

    const title = document.createElement("h3");
    title.textContent = song[0];

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = song[1];

    const download = document.createElement("a");
    download.href = song[1];
    download.download = song[1];
    download.textContent = "⬇ Şarkıyı İndir";

    div.append(title, audio, document.createElement("br"), download);
    container.appendChild(div);
});
</script>

</body>
</html>
